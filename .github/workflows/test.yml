name: API Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 启动 Mock 服务
        run: |
          python mock_server.py &
          sleep 3
          curl -s -o /dev/null -w "登录接口返回: %{http_code}\n" http://127.0.0.1:5000/login

      - name: 运行测试
        run: pytest -v